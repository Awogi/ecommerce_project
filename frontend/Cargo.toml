[package]
name = "school_uniform_store"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.20", features = ["csr"] }
yew-router = "0.17"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo = { version = "0.4", features = ["futures"] }
gloo-net = "0.4"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
  "Element",
  "Event",
  "EventTarget",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlFormElement",
  "HtmlButtonElement",
  "MouseEvent",
  "console",
] }
js-sys = "0.3"
wasm-logger = "0.2"
shared = { path = "../shared" }