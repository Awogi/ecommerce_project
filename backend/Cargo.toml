[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared" }
actix-cors = "0.6"
env_logger = "0.11"
local_ipaddress = "0.1"
thiserror = "1"
jsonwebtoken = "8"
rand = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.13"
bigdecimal = { version = "0.3", features = ["serde"] }
